# ==============================================================================
# Node: core-1
# Campus EVPN-VXLAN Fabric
# ==============================================================================

# ------------------------------------------------------------------------------
# Interfaces: Underlay & Inter-Switch Links
# ------------------------------------------------------------------------------
# ISL 1 to core-2 (ethernet-1/1)
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "ISL-1 to core-2:e1-1"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.1.0/31

# ISL 2 to core-2 (ethernet-1/2)
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "ISL-2 to core-2:e1-2"
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.0.1.2/31

# Uplink to agg-1 (ethernet-1/3)
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 description "Uplink to agg-1:e1-3"
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.0.2.0/31

# Uplink to agg-3 (ethernet-1/4)
set / interface ethernet-1/4 admin-state enable
set / interface ethernet-1/4 description "Uplink to agg-3:e1-3"
set / interface ethernet-1/4 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/4 subinterface 0 ipv4 address 10.0.2.4/31

# Uplink to agg-5 (ethernet-1/5)
set / interface ethernet-1/5 admin-state enable
set / interface ethernet-1/5 description "Uplink to agg-5:e1-3"
set / interface ethernet-1/5 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/5 subinterface 0 ipv4 address 10.0.2.8/31

# Uplink to agg-7 (ethernet-1/6)
set / interface ethernet-1/6 admin-state enable
set / interface ethernet-1/6 description "Uplink to agg-7:e1-3"
set / interface ethernet-1/6 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/6 subinterface 0 ipv4 address 10.0.2.12/31

# System Loopback
set / interface system0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.0.0.1/32

# ------------------------------------------------------------------------------
# VXLAN Tunnel Interface for Tenant VRF
# ------------------------------------------------------------------------------
set / tunnel-interface vxlan0 vxlan-interface 1000 type routed
set / tunnel-interface vxlan0 vxlan-interface 1000 ingress vni 1000

# ------------------------------------------------------------------------------
# Network Instance: Default (Underlay OSPF & Overlay iBGP Route Reflector)
# ------------------------------------------------------------------------------
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface ethernet-1/4.0
set / network-instance default interface ethernet-1/5.0
set / network-instance default interface ethernet-1/6.0
set / network-instance default interface system0.0

# OSPF Underlay
set / network-instance default protocols ospf instance underlay admin-state enable
set / network-instance default protocols ospf instance underlay version ospf-v2
set / network-instance default protocols ospf instance underlay router-id 10.0.0.1
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface system0.0 passive true
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface ethernet-1/1.0 interface-type point-to-point
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface ethernet-1/2.0 interface-type point-to-point
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface ethernet-1/3.0 interface-type point-to-point
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface ethernet-1/4.0 interface-type point-to-point
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface ethernet-1/5.0 interface-type point-to-point
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface ethernet-1/6.0 interface-type point-to-point

# iBGP EVPN Route Reflector
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65000
set / network-instance default protocols bgp router-id 10.0.0.1
set / network-instance default protocols bgp afi-safi evpn admin-state enable
set / network-instance default protocols bgp graceful-restart admin-state enable
set / network-instance default protocols bgp graceful-restart stale-routes-time 300
set / network-instance default protocols bgp afi-safi evpn evpn rapid-update true
set / network-instance default protocols bgp afi-safi evpn evpn keep-all-routes true

# Route Reflector Clients Group (Aggregation Switches)
set / network-instance default protocols bgp group rr-clients admin-state enable
set / network-instance default protocols bgp group rr-clients peer-as 65000
set / network-instance default protocols bgp group rr-clients afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp group rr-clients afi-safi evpn admin-state enable
set / network-instance default protocols bgp group rr-clients route-reflector client true
set / network-instance default protocols bgp group rr-clients route-reflector cluster-id 10.0.0.1
set / network-instance default protocols bgp group rr-clients timers connect-retry 15
set / network-instance default protocols bgp group rr-clients timers hold-time 30
set / network-instance default protocols bgp group rr-clients timers keepalive-interval 10
set / network-instance default protocols bgp group rr-clients transport local-address 10.0.0.1

# Route Reflector Peer Group (Inter-Core Peering)
set / network-instance default protocols bgp group rr-peer admin-state enable
set / network-instance default protocols bgp group rr-peer peer-as 65000
set / network-instance default protocols bgp group rr-peer afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp group rr-peer afi-safi evpn admin-state enable
set / network-instance default protocols bgp group rr-peer timers connect-retry 15
set / network-instance default protocols bgp group rr-peer timers hold-time 30
set / network-instance default protocols bgp group rr-peer timers keepalive-interval 10
set / network-instance default protocols bgp group rr-peer transport local-address 10.0.0.1

# Core Peer Neighbor
set / network-instance default protocols bgp neighbor 10.0.0.2 peer-group rr-peer
set / network-instance default protocols bgp neighbor 10.0.0.2 description "iBGP RR Peer core-2"

# Aggregation Client Neighbors
set / network-instance default protocols bgp neighbor 10.0.0.11 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.0.0.11 description "iBGP Client agg-1"
set / network-instance default protocols bgp neighbor 10.0.0.12 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.0.0.12 description "iBGP Client agg-2"
set / network-instance default protocols bgp neighbor 10.0.0.13 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.0.0.13 description "iBGP Client agg-3"
set / network-instance default protocols bgp neighbor 10.0.0.14 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.0.0.14 description "iBGP Client agg-4"
set / network-instance default protocols bgp neighbor 10.0.0.15 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.0.0.15 description "iBGP Client agg-5"
set / network-instance default protocols bgp neighbor 10.0.0.16 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.0.0.16 description "iBGP Client agg-6"
set / network-instance default protocols bgp neighbor 10.0.0.17 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.0.0.17 description "iBGP Client agg-7"
set / network-instance default protocols bgp neighbor 10.0.0.18 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.0.0.18 description "iBGP Client agg-8"

# ------------------------------------------------------------------------------
# Tenant IP-VRF (ip-vrf-1, VNI 1000)
# ------------------------------------------------------------------------------
set / network-instance ip-vrf-1 type ip-vrf
set / network-instance ip-vrf-1 admin-state enable
set / network-instance ip-vrf-1 description "Campus Tenant IP-VRF"
set / network-instance ip-vrf-1 vxlan-interface vxlan0.1000
set / network-instance ip-vrf-1 protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan0.1000
set / network-instance ip-vrf-1 protocols bgp-evpn bgp-instance 1 evi 1000
set / network-instance ip-vrf-1 protocols bgp-evpn bgp-instance 1 ecmp 8
set / network-instance ip-vrf-1 protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:1000
set / network-instance ip-vrf-1 protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:1000
