<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .title { font-family: sans-serif; font-size: 20px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
      .subtitle { font-family: sans-serif; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
      .box-standard { fill: #1e293b; stroke: #f43f5e; stroke-width: 2; rx: 8; }
      .box-anycast { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 8; }
      .panel-header-standard { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #fb7185; }
      .panel-header-anycast { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #34d399; }
      .label-title { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .label-desc { font-family: sans-serif; font-size: 12px; fill: #cbd5e1; }
      .badge-std { fill: #881337; stroke: #f43f5e; stroke-width: 1; rx: 4; }
      .badge-any { fill: #064e3b; stroke: #10b981; stroke-width: 1; rx: 4; }
      .node-rect { fill: #0284c7; stroke: #38bdf8; stroke-width: 1.5; rx: 6; }
      .node-text { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .link-std { stroke: #f43f5e; stroke-width: 2; stroke-dasharray: 4,3; }
      .link-any { stroke: #10b981; stroke-width: 2.5; }
      .arrow { fill: #38bdf8; }
    </style>
  </defs>

  <rect width="1200" height="620" class="bg" />

  <text x="600" y="35" class="title">EVPN Multihoming Comparison: Standard ESI vs. Anycast Multihoming</text>
  <text x="600" y="58" class="subtitle">Why Anycast Multihoming (Anycast VTEP) Drastically Reduces Control Plane &amp; Forwarding State</text>

  <!-- ========================================================================= -->
  <!-- LEFT PANEL: STANDARD ESI MULTIHOMING -->
  <!-- ========================================================================= -->
  <rect x="40" y="80" width="540" height="510" class="box-standard" />
  <text x="70" y="112" class="panel-header-standard">Traditional ESI Multihoming (RFC 7432)</text>

  <!-- Remote VTEP -->
  <rect x="250" y="140" width="120" height="45" class="node-rect" />
  <text x="310" y="167" class="node-text">Remote VTEP</text>

  <!-- Dual Unicast Tunnels -->
  <line x1="280" y1="185" x2="160" y2="280" class="link-std" />
  <line x1="340" y1="185" x2="460" y2="280" class="link-std" />
  <text x="180" y="230" font-family="sans-serif" font-size="11px" fill="#fda4af">VXLAN Tunnel 1</text>
  <text x="380" y="230" font-family="sans-serif" font-size="11px" fill="#fda4af">VXLAN Tunnel 2</text>

  <!-- Switches -->
  <rect x="100" y="280" width="120" height="45" class="node-rect" />
  <text x="160" y="300" class="node-text">Switch 1</text>
  <text x="160" y="316" font-family="sans-serif" font-size="10px" fill="#93c5fd" text-anchor="middle">VTEP: 10.0.0.11</text>

  <rect x="400" y="280" width="120" height="45" class="node-rect" />
  <text x="460" y="300" class="node-text">Switch 2</text>
  <text x="460" y="316" font-family="sans-serif" font-size="10px" fill="#93c5fd" text-anchor="middle">VTEP: 10.0.0.12</text>

  <!-- Host -->
  <line x1="160" y1="325" x2="310" y2="390" stroke="#94a3b8" stroke-width="2" />
  <line x1="460" y1="325" x2="310" y2="390" stroke="#94a3b8" stroke-width="2" />
  <rect x="250" y="390" width="120" height="40" rx="6" fill="#3b82f6" />
  <text x="310" y="415" class="node-text">Multihomed Host</text>

  <!-- Standard ESI Properties -->
  <rect x="60" y="450" width="500" height="125" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="80" y="475" font-family="sans-serif" font-size="12px" fill="#fb7185" font-weight="bold">• Separate Next-Hop per switch (10.0.0.11 &amp; 10.0.0.12)</text>
  <text x="80" y="497" font-family="sans-serif" font-size="12px" fill="#cbd5e1">• Requires EVPN Type-1 (Auto-Discovery) for Overlay Aliasing</text>
  <text x="80" y="519" font-family="sans-serif" font-size="12px" fill="#cbd5e1">• Remote VTEPs build &amp; monitor N separate VXLAN tunnels</text>
  <text x="80" y="541" font-family="sans-serif" font-size="12px" fill="#cbd5e1">• Route churn when single member flaps; multiplies BGP state</text>
  <text x="80" y="563" font-family="sans-serif" font-size="12px" fill="#cbd5e1">• Heavy state scale in campus cores tracking thousands of VTEP bindings</text>


  <!-- ========================================================================= -->
  <!-- RIGHT PANEL: ANYCAST MULTIHOMING -->
  <!-- ========================================================================= -->
  <rect x="620" y="80" width="540" height="510" class="box-anycast" />
  <text x="650" y="112" class="panel-header-anycast">Anycast Multihoming (Campus Optimized)</text>

  <!-- Remote VTEP -->
  <rect x="830" y="140" width="120" height="45" class="node-rect" />
  <text x="890" y="167" class="node-text">Remote VTEP</text>

  <!-- Single Anycast ECMP Tunnel -->
  <line x1="890" y1="185" x2="890" y2="245" class="link-any" />
  <line x1="890" y1="245" x2="740" y2="280" class="link-any" />
  <line x1="890" y1="245" x2="1040" y2="280" class="link-any" />
  <rect x="820" y="210" width="140" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="890" y="226" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#86efac" text-anchor="middle">Underlay ECMP</text>

  <!-- Switches with shared Anycast VTEP -->
  <rect x="680" y="280" width="120" height="45" class="node-rect" />
  <text x="740" y="300" class="node-text">Switch 1</text>
  <text x="740" y="316" font-family="sans-serif" font-size="10px" fill="#86efac" text-anchor="middle">Anycast: 10.0.0.101</text>

  <rect x="980" y="280" width="120" height="45" class="node-rect" />
  <text x="1040" y="300" class="node-text">Switch 2</text>
  <text x="1040" y="316" font-family="sans-serif" font-size="10px" fill="#86efac" text-anchor="middle">Anycast: 10.0.0.101</text>

  <!-- Host -->
  <line x1="740" y1="325" x2="890" y2="390" stroke="#22c55e" stroke-width="2.5" />
  <line x1="1040" y1="325" x2="890" y2="390" stroke="#22c55e" stroke-width="2.5" />
  <rect x="830" y="390" width="120" height="40" rx="6" fill="#3b82f6" />
  <text x="890" y="415" class="node-text">Multihomed Host</text>

  <!-- Anycast MH Properties -->
  <rect x="640" y="450" width="500" height="125" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="660" y="475" font-family="sans-serif" font-size="12px" fill="#34d399" font-weight="bold">• Shared Single Next-Hop VTEP (10.0.0.101) advertised to fabric</text>
  <text x="660" y="497" font-family="sans-serif" font-size="12px" fill="#cbd5e1">• Underlay OSPF ECMP balances ingress packets across pair</text>
  <text x="660" y="519" font-family="sans-serif" font-size="12px" fill="#cbd5e1">• Remote VTEPs see 1 logical VTEP per building (50% tunnel reduction)</text>
  <text x="660" y="541" font-family="sans-serif" font-size="12px" fill="#cbd5e1">• No overlay aliasing complexity; sub-second local failover across ISL</text>
  <text x="660" y="563" font-family="sans-serif" font-size="12px" fill="#cbd5e1">• Maximizes hardware scale: cores store 1/2 VTEP &amp; VNI bindings</text>

</svg>
