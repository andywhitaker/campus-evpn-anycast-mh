# ==============================================================================
# Node: agg-5 (Pair 3)
# Campus EVPN-VXLAN Fabric
# ==============================================================================

# ------------------------------------------------------------------------------
# Interfaces: Underlay & Inter-Switch Links
# ------------------------------------------------------------------------------
# ISL-1 to agg-6 (ethernet-1/1)
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "ISL-1 to agg-6:e1-1"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.3.8/31

# ISL-2 to agg-6 (ethernet-1/2)
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "ISL-2 to agg-6:e1-2"
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.0.3.10/31

# Core Uplink to core-1 (ethernet-1/3)
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 description "Uplink to core-1:e1-5"
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.0.2.9/31

# System Loopback
set / interface system0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.0.0.15/32

# Shared Anycast VTEP Loopback (lo0)
set / interface lo0 admin-state enable
set / interface lo0 subinterface 1 admin-state enable
set / interface lo0 subinterface 1 ipv4 admin-state enable
set / interface lo0 subinterface 1 ipv4 address 10.0.0.103/32

# ------------------------------------------------------------------------------
# Access Interfaces & LAGs
# ------------------------------------------------------------------------------
# Single-Homed Host h1-v301 (ethernet-1/4)
set / interface ethernet-1/4 admin-state enable
set / interface ethernet-1/4 description "Access to h1-v301"
set / interface ethernet-1/4 subinterface 0 type bridged
set / interface ethernet-1/4 subinterface 0 admin-state enable

# Single-Homed Host h1-v302 (ethernet-1/5)
set / interface ethernet-1/5 admin-state enable
set / interface ethernet-1/5 description "Access to h1-v302"
set / interface ethernet-1/5 subinterface 0 type bridged
set / interface ethernet-1/5 subinterface 0 admin-state enable

# Multihomed Host hm-v301 LAG Member (ethernet-1/6)
set / interface ethernet-1/6 admin-state enable
set / interface ethernet-1/6 description "LAG-1 member for hm-v301"
set / interface ethernet-1/6 ethernet aggregate-id lag1

# LAG 1 (hm-v301)
set / interface lag1 admin-state enable
set / interface lag1 description "Multihomed LAG-1 to hm-v301"
set / interface lag1 subinterface 0 type bridged
set / interface lag1 subinterface 0 admin-state enable
set / interface lag1 lag lag-type lacp
set / interface lag1 lag lacp interval FAST
set / interface lag1 lag lacp lacp-mode ACTIVE
set / interface lag1 lag lacp admin-key 301
set / interface lag1 lag lacp system-id-mac 00:00:00:03:01:01
set / interface lag1 lag lacp system-priority 100

# Multihomed Host hm-v302 LAG Member (ethernet-1/7)
set / interface ethernet-1/7 admin-state enable
set / interface ethernet-1/7 description "LAG-2 member for hm-v302"
set / interface ethernet-1/7 ethernet aggregate-id lag2

# LAG 2 (hm-v302)
set / interface lag2 admin-state enable
set / interface lag2 description "Multihomed LAG-2 to hm-v302"
set / interface lag2 subinterface 0 type bridged
set / interface lag2 subinterface 0 admin-state enable
set / interface lag2 lag lag-type lacp
set / interface lag2 lag lacp interval FAST
set / interface lag2 lag lacp lacp-mode ACTIVE
set / interface lag2 lag lacp admin-key 302
set / interface lag2 lag lacp system-id-mac 00:00:00:03:01:02
set / interface lag2 lag lacp system-priority 100

# ------------------------------------------------------------------------------
# Integrated Routing and Bridging (IRB) Interfaces
# ------------------------------------------------------------------------------
set / interface irb0 admin-state enable

# IRB for VLAN 301 (10.3.1.0/24)
set / interface irb0 subinterface 301 description "Anycast GW for VLAN 301"
set / interface irb0 subinterface 301 ip-mtu 1500
set / interface irb0 subinterface 301 ipv4 admin-state enable
set / interface irb0 subinterface 301 ipv4 address 10.3.1.1/24 anycast-gw true
set / interface irb0 subinterface 301 ipv4 address 10.3.1.1/24 primary
set / interface irb0 subinterface 301 ipv4 arp timeout 300
set / interface irb0 subinterface 301 ipv4 arp learn-unsolicited true
set / interface irb0 subinterface 301 ipv4 arp evpn advertise dynamic
set / interface irb0 subinterface 301 anycast-gw virtual-router-id 1

# IRB for VLAN 302 (10.3.2.0/24)
set / interface irb0 subinterface 302 description "Anycast GW for VLAN 302"
set / interface irb0 subinterface 302 ip-mtu 1500
set / interface irb0 subinterface 302 ipv4 admin-state enable
set / interface irb0 subinterface 302 ipv4 address 10.3.2.1/24 anycast-gw true
set / interface irb0 subinterface 302 ipv4 address 10.3.2.1/24 primary
set / interface irb0 subinterface 302 ipv4 arp timeout 300
set / interface irb0 subinterface 302 ipv4 arp learn-unsolicited true
set / interface irb0 subinterface 302 ipv4 arp evpn advertise dynamic
set / interface irb0 subinterface 302 anycast-gw virtual-router-id 2

# ------------------------------------------------------------------------------
# VXLAN Tunnel Interfaces
# ------------------------------------------------------------------------------
# Routed VNI for Tenant IP-VRF
set / tunnel-interface vxlan0 vxlan-interface 1000 type routed
set / tunnel-interface vxlan0 vxlan-interface 1000 ingress vni 1000

# Bridged VNIs for MAC-VRFs
set / tunnel-interface vxlan0 vxlan-interface 10301 type bridged
set / tunnel-interface vxlan0 vxlan-interface 10301 ingress vni 10301

set / tunnel-interface vxlan0 vxlan-interface 10302 type bridged
set / tunnel-interface vxlan0 vxlan-interface 10302 ingress vni 10302

# ------------------------------------------------------------------------------
# Routing Policies
# ------------------------------------------------------------------------------
set / routing-policy prefix-set SUBNETS prefix 10.0.0.0/8 mask-length-range 24..24
set / routing-policy prefix-set HOST-ROUTES prefix 10.0.0.0/8 mask-length-range 32..32

# Export Policy to Cores: Advertise /24 Subnets; Reject /32 Host Routes
set / routing-policy policy EXPORT-TO-CORES statement 10 match bgp evpn route-type [ 1 ]
set / routing-policy policy EXPORT-TO-CORES statement 10 action policy-result accept
set / routing-policy policy EXPORT-TO-CORES statement 20 match bgp evpn route-type [ 2 ]
set / routing-policy policy EXPORT-TO-CORES statement 20 action policy-result accept
set / routing-policy policy EXPORT-TO-CORES statement 30 match bgp evpn route-type [ 3 ]
set / routing-policy policy EXPORT-TO-CORES statement 30 action policy-result accept
set / routing-policy policy EXPORT-TO-CORES statement 40 match bgp evpn route-type [ 4 ]
set / routing-policy policy EXPORT-TO-CORES statement 40 action policy-result accept
set / routing-policy policy EXPORT-TO-CORES statement 50 match bgp evpn route-type [ 5 ]
set / routing-policy policy EXPORT-TO-CORES statement 50 match prefix prefix-set SUBNETS
set / routing-policy policy EXPORT-TO-CORES statement 50 action policy-result accept
set / routing-policy policy EXPORT-TO-CORES statement 60 match bgp evpn route-type [ 5 ]
set / routing-policy policy EXPORT-TO-CORES statement 60 match prefix prefix-set HOST-ROUTES
set / routing-policy policy EXPORT-TO-CORES statement 60 action policy-result reject
set / routing-policy policy EXPORT-TO-CORES default-action policy-result reject

# Export Policy across ISL Peering: Advertise /32 Host Routes and all EVPN routes
set / routing-policy policy EXPORT-TO-ISL statement 10 match bgp evpn route-type [ 1 ]
set / routing-policy policy EXPORT-TO-ISL statement 10 action policy-result accept
set / routing-policy policy EXPORT-TO-ISL statement 20 match bgp evpn route-type [ 2 ]
set / routing-policy policy EXPORT-TO-ISL statement 20 action policy-result accept
set / routing-policy policy EXPORT-TO-ISL statement 30 match bgp evpn route-type [ 3 ]
set / routing-policy policy EXPORT-TO-ISL statement 30 action policy-result accept
set / routing-policy policy EXPORT-TO-ISL statement 40 match bgp evpn route-type [ 4 ]
set / routing-policy policy EXPORT-TO-ISL statement 40 action policy-result accept
set / routing-policy policy EXPORT-TO-ISL statement 50 match bgp evpn route-type [ 5 ]
set / routing-policy policy EXPORT-TO-ISL statement 50 action policy-result accept
set / routing-policy policy EXPORT-TO-ISL default-action policy-result reject

# ------------------------------------------------------------------------------
# Network Instance: Default (Underlay OSPF & Overlay iBGP)
# ------------------------------------------------------------------------------
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface system0.0
set / network-instance default interface lo0.1

# OSPF Underlay
set / network-instance default protocols ospf instance underlay admin-state enable
set / network-instance default protocols ospf instance underlay version ospf-v2
set / network-instance default protocols ospf instance underlay router-id 10.0.0.15
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface system0.0 passive true
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface lo0.1 passive true
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface ethernet-1/1.0 interface-type point-to-point
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface ethernet-1/2.0 interface-type point-to-point
set / network-instance default protocols ospf instance underlay area 0.0.0.0 interface ethernet-1/3.0 interface-type point-to-point

# iBGP EVPN Peering
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65000
set / network-instance default protocols bgp router-id 10.0.0.15
set / network-instance default protocols bgp afi-safi evpn admin-state enable
set / network-instance default protocols bgp graceful-restart admin-state enable
set / network-instance default protocols bgp graceful-restart stale-routes-time 300
set / network-instance default protocols bgp afi-safi evpn evpn rapid-update true

# Core Overlay Group (Core-1 & Core-2 Route Reflectors)
set / network-instance default protocols bgp group overlay-cores admin-state enable
set / network-instance default protocols bgp group overlay-cores peer-as 65000
set / network-instance default protocols bgp group overlay-cores afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp group overlay-cores afi-safi evpn admin-state enable
set / network-instance default protocols bgp group overlay-cores export-policy [ EXPORT-TO-CORES ]
set / network-instance default protocols bgp group overlay-cores timers connect-retry 15
set / network-instance default protocols bgp group overlay-cores timers hold-time 30
set / network-instance default protocols bgp group overlay-cores timers keepalive-interval 10
set / network-instance default protocols bgp group overlay-cores transport local-address 10.0.0.15

set / network-instance default protocols bgp neighbor 10.0.0.1 peer-group overlay-cores
set / network-instance default protocols bgp neighbor 10.0.0.1 description "iBGP to Core-1 RR"
set / network-instance default protocols bgp neighbor 10.0.0.2 peer-group overlay-cores
set / network-instance default protocols bgp neighbor 10.0.0.2 description "iBGP to Core-2 RR"

# ISL Overlay Group (Peering to agg-6 across ISL)
set / network-instance default protocols bgp group overlay-isl admin-state enable
set / network-instance default protocols bgp group overlay-isl peer-as 65000
set / network-instance default protocols bgp group overlay-isl afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp group overlay-isl afi-safi evpn admin-state enable
set / network-instance default protocols bgp group overlay-isl export-policy [ EXPORT-TO-ISL ]
set / network-instance default protocols bgp group overlay-isl timers connect-retry 15
set / network-instance default protocols bgp group overlay-isl timers hold-time 30
set / network-instance default protocols bgp group overlay-isl timers keepalive-interval 10
set / network-instance default protocols bgp group overlay-isl transport local-address 10.0.0.15

set / network-instance default protocols bgp neighbor 10.0.0.16 peer-group overlay-isl
set / network-instance default protocols bgp neighbor 10.0.0.16 description "iBGP ISL Peer agg-6"

# ------------------------------------------------------------------------------
# EVPN Anycast Multi-Homing Ethernet Segments
# ------------------------------------------------------------------------------
set / system network-instance protocols bgp-vpn bgp-instance 1

# Ethernet Segment for LAG 1 (hm-v301)
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG1 admin-state enable
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG1 esi 00:03:01:00:00:00:00:00:00:01
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG1 multi-homing-mode all-active
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG1 interface lag1
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG1 anycast-multi-homing ip-address 10.0.0.103
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG1 df-election algorithm type preference
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG1 df-election algorithm preference-alg preference-value 200
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG1 df-election algorithm preference-alg capabilities ac-df exclude

# Ethernet Segment for LAG 2 (hm-v302)
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG2 admin-state enable
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG2 esi 00:03:01:00:00:00:00:00:00:02
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG2 multi-homing-mode all-active
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG2 interface lag2
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG2 anycast-multi-homing ip-address 10.0.0.103
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG2 df-election algorithm type preference
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG2 df-election algorithm preference-alg preference-value 200
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-LAG2 df-election algorithm preference-alg capabilities ac-df exclude

# ------------------------------------------------------------------------------
# Tenant IP-VRF (ip-vrf-1, VNI 1000)
# ------------------------------------------------------------------------------
set / network-instance ip-vrf-1 type ip-vrf
set / network-instance ip-vrf-1 admin-state enable
set / network-instance ip-vrf-1 description "Campus Tenant IP-VRF"
set / network-instance ip-vrf-1 interface irb0.301
set / network-instance ip-vrf-1 interface irb0.302
set / network-instance ip-vrf-1 vxlan-interface vxlan0.1000
set / network-instance ip-vrf-1 protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan0.1000
set / network-instance ip-vrf-1 protocols bgp-evpn bgp-instance 1 evi 1000
set / network-instance ip-vrf-1 protocols bgp-evpn bgp-instance 1 ecmp 8
set / network-instance ip-vrf-1 protocols bgp-evpn bgp-instance 1 routes route-table mac-ip advertise-gateway-mac true
set / network-instance ip-vrf-1 protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:1000
set / network-instance ip-vrf-1 protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:1000

# ------------------------------------------------------------------------------
# MAC-VRFs
# ------------------------------------------------------------------------------
# MAC-VRF 301 (VLAN 301, VNI 10301)
set / network-instance mac-vrf-301 type mac-vrf
set / network-instance mac-vrf-301 admin-state enable
set / network-instance mac-vrf-301 bridge-table mac-duplication admin-state enable
set / network-instance mac-vrf-301 bridge-table mac-duplication action stop-learning
set / network-instance mac-vrf-301 bridge-table mac-learning aging age-time 600
set / network-instance mac-vrf-301 description "MAC-VRF for VLAN 301"
set / network-instance mac-vrf-301 interface ethernet-1/4.0
set / network-instance mac-vrf-301 interface lag1.0
set / network-instance mac-vrf-301 interface irb0.301
set / network-instance mac-vrf-301 vxlan-interface vxlan0.10301
set / network-instance mac-vrf-301 protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan0.10301
set / network-instance mac-vrf-301 protocols bgp-evpn bgp-instance 1 evi 10301
set / network-instance mac-vrf-301 protocols bgp-evpn bgp-instance 1 ecmp 8
set / network-instance mac-vrf-301 protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:10301
set / network-instance mac-vrf-301 protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:10301

# MAC-VRF 302 (VLAN 302, VNI 10302)
set / network-instance mac-vrf-302 type mac-vrf
set / network-instance mac-vrf-302 admin-state enable
set / network-instance mac-vrf-302 bridge-table mac-duplication admin-state enable
set / network-instance mac-vrf-302 bridge-table mac-duplication action stop-learning
set / network-instance mac-vrf-302 bridge-table mac-learning aging age-time 600
set / network-instance mac-vrf-302 description "MAC-VRF for VLAN 302"
set / network-instance mac-vrf-302 interface ethernet-1/5.0
set / network-instance mac-vrf-302 interface lag2.0
set / network-instance mac-vrf-302 interface irb0.302
set / network-instance mac-vrf-302 vxlan-interface vxlan0.10302
set / network-instance mac-vrf-302 protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan0.10302
set / network-instance mac-vrf-302 protocols bgp-evpn bgp-instance 1 evi 10302
set / network-instance mac-vrf-302 protocols bgp-evpn bgp-instance 1 ecmp 8
set / network-instance mac-vrf-302 protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:10302
set / network-instance mac-vrf-302 protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:10302
